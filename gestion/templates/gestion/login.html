{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Restaurante</title>

    <link rel="stylesheet" href="{% static 'gestion/css/styles.css' %}">
</head>

<body>

<div class="login-container">

    <h2>Iniciar Sesión</h2>

    {% if messages %}
        {% for message in messages %}
            <p style="color:red;">
                {{ message }}
            </p>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <input type="text"
               name="username"
               placeholder="Usuario"
               required>

        <input type="password"
               name="password"
               placeholder="Contraseña"
               required>

        <button type="submit">
            Ingresar
        </button>

    </form>

</div>

</body>
</html>
